version: "3.9"

services:

  # ── Bot do primeiro cliente (topphone) ─────────────────────
  topphone:
    build: .
    image: biaphone:latest        # imagem compartilhada com todos os clientes
    container_name: biaphone_topphone
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - DATABASE_URL=sqlite:////app/data/topphone.db
    env_file:
      - .env

  # ── Painel de Administração ─────────────────────────────────
  admin:
    build: ./admin
    container_name: biaphone_admin
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # gerencia containers
      - ./clients:/clients                           # dados e registro dos clientes
      - .:/bot_source                                # código-fonte para rebuild
    env_file:
      - .env
    environment:
      - CLIENTS_DIR=/clients
      - HOST_CLIENTS_DIR=/root/biaphone/clients
      - BOT_IMAGE=biaphone:latest
      - BOT_SOURCE_DIR=/bot_source
      - BASE_PORT=8000
